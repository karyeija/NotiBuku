name: notibuku
description: "A new handy notebook."
publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_card_swiper: ^7.0.2
  permission_handler: ^12.0.1
  sqflite_common_ffi: ^2.3.7+1
  animated_text_kit2: ^0.0.4
  path_provider: ^2.1.5
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  media_gallery_saver: ^1.3.4
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: 2.5.1
  material_ui: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Piazzolla
      fonts:
        - asset: assets/fonts/Piazzolla-Bold.ttf
        - asset: assets/fonts/Piazzolla-Regular.ttf
          style: italic
          weight: 700

    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Bold.ttf
        - asset: assets/fonts/FiraCode-Regular.ttf
          style: italic
          weight: 700

    - family: Technology
      fonts:
        - asset: assets/fonts/Technology-Bold.ttf
        - asset: assets/fonts/Technology-Italic.ttf
          style: italic
          weight: 700

    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf
          style: italic
          weight: 700

    - family: AGENCYB
      fonts:
        - asset: assets/fonts/AGENCYB.TTF
          style: italic
          weight: 700

    - family: AgendaKing
      fonts:
        - asset: assets/fonts/AgendaKing.ttf
          style: italic
          weight: 700

    - family: ALGER
      fonts:
        - asset: assets/fonts/ALGER.TTF
          style: italic
          weight: 700

    - family: PerfectoCalligraphy
      fonts:
        - asset: assets/fonts/PerfectoCalligraphy.ttf
          style: italic
          weight: 700

    - family: OrganicalPersonalUseBoldItalic
      fonts:
        - asset: assets/fonts/OrganicalPersonalUseBoldItalic-2O6xe.ttf
          style: italic
          weight: 700

    - family: Cambria
      fonts:
        - asset: assets/fonts/cambriai.ttf
        - asset: assets/fonts/cambriai.ttf
          style: italic
          weight: 700

    - family: BeautifulPeoplePersonalUse
      fonts:
        - asset: assets/fonts/BeautifulPeoplePersonalUse-dE0g.ttf
          style: italic
          weight: 700

    - family: HighupItalicPersonalUseBoldItalic
      fonts:
        - asset: assets/fonts/HighupItalicPersonalUseBoldItalic-vmqnM.ttf
          style: italic
          weight: 700

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#000099"
  adaptive_icon_foreground: "assets/icons/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21